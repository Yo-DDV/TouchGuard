name: Native checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Isolated state tests and sanitizers
        run: bash scripts/test.sh "$RUNNER_TEMP/checks"
      - name: Universal native app
        run: bash scripts/build.sh "$RUNNER_TEMP/app"
      - name: Check both executable architectures
        run: xcrun lipo -archs "$RUNNER_TEMP/app/TouchGuard.app/Contents/MacOS/TouchGuard" | python3 -c 'import sys; assert set(sys.stdin.read().split()) == {"arm64", "x86_64"}'
      - name: Static analyzer
        run: |
          xcrun clang --analyze -Xanalyzer -analyzer-werror -Xanalyzer -analyzer-output=text -x objective-c -fobjc-arc -I modern \
            -mmacosx-version-min=14.0 modern/main.m tests/native_probe.m
          xcrun clang --analyze -Xanalyzer -analyzer-werror -Xanalyzer -analyzer-output=text -std=c11 -I modern modern/guard.c
